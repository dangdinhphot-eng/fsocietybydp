<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fsociety System Overload</title>
    <style>
        body {
            background-color: black;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            width: 85%;
            max-width: 900px;
            justify-content: space-between;
            align-items: center;
        }
        .left-side {
            color: #00FF00;
            font-size: 14px;
            font-weight: bold;
            white-space: pre;
            line-height: 1.2;
        }
        .right-side {
            text-align: center;
            flex-grow: 1;
            margin-left: 50px;
        }
        h1 {
            color: #FF0000;
            font-size: 28px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input {
            background-color: #111;
            border: 1px solid #00FF00;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            padding: 10px;
            width: 200px;
            text-align: center;
            outline: none;
        }
        button {
            background-color: black;
            border: 1px solid #00FF00;
            color: #00FF00;
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00FF00;
            color: black;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            margin-top: 30px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body> 

     <!-- Nguồn nhạc mạng trực tuyến chuẩn chất lượng cao -->
    <audio id="hackerMusic" loop>
        <source src="https://open.spotify.com/intl-vi/track/21sNgP2plpm6XcJQPrYxVa" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Mặt nạ xanh lá vẽ bằng ký tự bên trái -->
        <div class="left-side">
      .---.        .---.
     /     \  _   /     \

    |   o   |( ) |   o   |
    |       |/ \ |       |
     \     /     \     /
   _  `---'       `---'  _
  ( \  /             \  / )
   \ \/               \/ /
    \                   /
     `---.__     __.---'
            `---'
     [  D I N H P H U C  ]
        </div>

        <!-- Nội dung cảnh báo và đồng hồ bên phải -->
        <div class="right-side">
            <h1>PHONE IS LOCK!!</h1>
        <input type="text" value="***"><br>
        <button>CHECK</button>
        <div class="timer" id="countdown">2:59:57</div>
        
        <!-- NÚT PHÁT NHẠC ĐƯỢC TÁCH RIÊNG (NẰM NGOÀI THẺ A) -->
        <div style="margin-top: 15px;">
            <button id="playBtn" style="background-color: black; border: 1px solid #00FF00; color: #00FF00; padding: 10px 25px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(0,255,0,0.2);">
                ▶ PLAY MUSIC
            </button>
        </div>
        Under Maintenance


        <!-- ĐƯỜNG LINK TIKTOK TÁCH BIỆT HOÀN TOÀN -->
        <p style="margin-top: 20px;">
            <a href="https://tiktok.com" target="_blank" style="color: #FF0000; text-decoration: none; font-family: 'Courier New', monospace; font-weight: bold; border-bottom: 1px dashed #00FF00;">
                [ CLICK TO ADMIN PASSWORD ]
            </a>
        </p>
        </div>
    </div>

<script>
    const UNLOCK_CODE = "xxx"; 
    let attemptsLeft = 10;
    let isUnlocked = false;
    let timerInterval;

    const timerDisplay = document.getElementById('countdown');
    const inputField = document.querySelector('input');
    const checkButton = document.querySelector('button');
    const titleDisplay = document.querySelector('h1');

    // --- KHÓA NÚT QUAY LẠI (BACK) CHỐNG THOÁT KHỎI TRANG ---
    function lockNavigation() {
        if (!isUnlocked) {
            window.history.pushState(null, null, window.location.href);
        }
    }

    window.history.pushState(null, null, window.location.href);
    
    window.addEventListener('popstate', () => {
        if (!isUnlocked) {
            alert("CẢNH BÁO: Bạn không thể quay lại! Hệ thống đang bị khóa cứng.");
            window.history.pushState(null, null, window.location.href);
        }
    });

    window.addEventListener('beforeunload', (event) => {
        if (!isUnlocked) {
            event.preventDefault();
            event.returnValue = "Hệ thống đang bị khóa!";
            return event.returnValue;
        }
    });

    inputField.addEventListener('focus', () => {
        if (inputField.value === '***' || inputField.value === 'LOCKED FOREVER') inputField.value = '';
    });

    // --- CẤU HÌNH THỜI GIAN THỰC ---
    const TWO_HOURS_IN_MS = 2 * 60 * 60 * 1000;
    let endTime = localStorage.getItem('fsociety_phuc_reset');

    if (!endTime) {
        endTime = Date.now() + TWO_HOURS_IN_MS;
        localStorage.setItem('fsociety_phuc_reset', endTime);
    } else {
        endTime = parseInt(endTime, 10);
    }

    function startCountdown() {
        timerInterval = setInterval(() => {
            let now = Date.now();
            let timeLeft = endTime - now;

            if (timeLeft > 0) {
                let totalSeconds = Math.floor(timeLeft / 1000);
                let hrs = Math.floor(totalSeconds / 3600);
                let mins = Math.floor((totalSeconds % 3600) / 60);
                let secs = totalSeconds % 60;

                timerDisplay.innerText = 
                    (hrs < 10 ? "0" : "") + hrs + ":" + 
                    (mins < 10 ? "0" : "") + mins + ":" + 
                    (secs < 10 ? "0" : "") + secs;
            } else {
                triggerSystemDelete();
            }
        }, 1000);
    }

    function triggerSystemDelete() {
        clearInterval(timerInterval);
        isUnlocked = false;
        titleDisplay.innerText = "SYSTEM DELETED!";
        titleDisplay.style.color = "#FF0000";
        timerDisplay.innerText = "00:00:00";
        timerDisplay.style.color = "#FF0000";
        inputField.value = "LOCKED FOREVER";
        inputField.disabled = true;
        checkButton.disabled = true;
        checkButton.innerText = "FAILED";
        if (bgMusic) bgMusic.pause(); // Tắt nhạc khi hệ thống sập
    }

    // --- XỬ LÝ SỰ KIỆN BẤM NÚT CHECK ---
    checkButton.addEventListener('click', () => {
        const userCode = inputField.value.trim();
        if (attemptsLeft <= 0) return;

        if (userCode === UNLOCK_CODE) {
            isUnlocked = true; 
            clearInterval(timerInterval);
            localStorage.removeItem('fsociety_phuc_reset');
            titleDisplay.innerText = "SYSTEM UNLOCKED SUCCESSFULLY!";
            if (bgMusic) bgMusic.pause();
            alert("Chúc mừng Đinh Phúc đã giải mã thành công.");
            window.location.replace("https://jonathanbassedas.github.io/halloween/"); 
        } else {
            attemptsLeft--;
            if (attemptsLeft > 0) {
                alert("Sai rồi! Còn " + attemptsLeft + " lần thử.");
            } else {
                triggerSystemDelete();
            }
        }
    });
    // --- HỆ THỐNG ĐIỀU KHIỂN NÚT PLAY/PAUSE NHẠC BẤT TỬ ---
    let bgMusic = new Audio("https://open.spotify.com/intl-vi/track/21sNgP2plpm6XcJQPrYxVa");
    bgMusic.loop = true;

    const playBtn = document.getElementById('playBtn');
    let isPlaying = false;

    if (playBtn) {
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "█ PAUSE MUSIC";
                    playBtn.style.borderColor = "#FF0000";
                    playBtn.style.color = "#FF0000";
                }).catch(error => {
                    // Nếu không có file nhạc trong máy, tự động lấy link nhạc mạng dự phòng để phát
                    bgMusic.src = "https://open.spotify.com/intl-vi/track/21sNgP2plpm6XcJQPrYxVa";
                    bgMusic.play().then(() => {
                        isPlaying = true;
                        playBtn.innerText = "█ PAUSE MUSIC";
                        playBtn.style.borderColor = "#FF0000";
                        playBtn.style.color = "#FF0000";
                    });
                });
            } else {
                bgMusic.pause();
                isPlaying = false;
                playBtn.innerText = "▶ PLAY MUSIC";
                playBtn.style.borderColor = "#00FF00";
                playBtn.style.color = "#00FF00";
            }
        });
    }

    startCountdown();
</script>
</body>
</html>
